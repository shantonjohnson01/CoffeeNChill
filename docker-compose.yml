services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: coffeenchill-azurite
    command: >
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /data
      --debug /data/debug.log
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    networks:
      - coffeenchill-network
    restart: unless-stopped

  functions:
    image: shantonjohnson2004/coffeenchill-functions:v2.0
    container_name: coffeenchill-functions
    depends_on:
      - azurite
    environment:
      AzureWebJobsStorage: "${AZURITE_STORAGE_CONNECTION}"
      FUNCTIONS_WORKER_RUNTIME: "dotnet-isolated"
    ports:
      - "7071:80"
    networks:
      - coffeenchill-network
    restart: unless-stopped

volumes:
  azurite-data:

networks:
  coffeenchill-network:
    driver: bridge